name: CI Test & Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (production paths)
        run: npm audit --omit=dev --audit-level=high

      - name: Type Check & Lint
        run: npm run lint

      - name: Anti-slop lint (vendored rules, zero-warning gate)
        run: npm run lint:slop

      - name: Dead-code audit (knip)
        run: npm run lint:knip

      - name: Run Test Suite
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Build Storybook (stories must compile)
        run: npm run build-storybook
